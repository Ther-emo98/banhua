<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>写给小霞 · 一封信</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:radial-gradient(circle at 50% 40%,#2a0a2b 0%,#12041a 46%,#05020a 100%)}
  body{
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
    color:#fff;cursor:pointer;user-select:none;-webkit-user-select:none
  }

  /* ================= 背景层 ================= */
  .aurora{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
  .blob{position:absolute;border-radius:50%;filter:blur(80px);opacity:.5;mix-blend-mode:screen;will-change:transform}
  .b1{width:70vmax;height:70vmax;left:-22vmax;top:-26vmax;background:radial-gradient(circle,#ff2d6f 0%,rgba(255,45,111,0) 65%);animation:drift1 24s ease-in-out infinite alternate}
  .b2{width:62vmax;height:62vmax;right:-20vmax;top:-12vmax;background:radial-gradient(circle,#7b2ff7 0%,rgba(123,47,247,0) 65%);animation:drift2 28s ease-in-out infinite alternate}
  .b3{width:66vmax;height:66vmax;left:14vmax;bottom:-32vmax;background:radial-gradient(circle,#ff8c00 0%,rgba(255,140,0,0) 62%);opacity:.28;animation:drift3 32s ease-in-out infinite alternate}
  @keyframes drift1{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(12vmax,8vmax,0) scale(1.2)}}
  @keyframes drift2{from{transform:translate3d(0,0,0) scale(1.1)}to{transform:translate3d(-14vmax,10vmax,0) scale(.9)}}
  @keyframes drift3{from{transform:translate3d(0,0,0) scale(.95)}to{transform:translate3d(10vmax,-12vmax,0) scale(1.15)}}

  .rays{position:fixed;left:50%;top:44%;width:170vmax;height:170vmax;transform:translate(-50%,-50%);
    background:repeating-conic-gradient(from 0deg,rgba(255,120,170,.13) 0deg 2.4deg,rgba(255,120,170,0) 2.4deg 11deg);
    -webkit-mask-image:radial-gradient(circle,rgba(0,0,0,.95) 0%,rgba(0,0,0,0) 58%);
    mask-image:radial-gradient(circle,rgba(0,0,0,.95) 0%,rgba(0,0,0,0) 58%);
    animation:spin 52s linear infinite;z-index:0;pointer-events:none;opacity:.5;mix-blend-mode:screen}
  @keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}

  .halo{position:fixed;left:50%;top:44%;width:130vmin;height:130vmin;transform:translate(-50%,-50%);
    background:radial-gradient(circle,rgba(255,95,145,.24) 0%,rgba(255,60,120,.09) 36%,rgba(255,0,90,0) 68%);
    animation:breathe 4.6s ease-in-out infinite;pointer-events:none;z-index:0;mix-blend-mode:screen}
  @keyframes breathe{0%,100%{opacity:.5;transform:translate(-50%,-50%) scale(.92)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.07)}}

  /* 暖色黎明收尾光 */
  .dawn{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0;transition:opacity 4s ease;mix-blend-mode:screen;
    background:radial-gradient(ellipse at 50% 118%,rgba(255,150,90,.42) 0%,rgba(255,90,130,.20) 38%,rgba(255,60,120,0) 68%)}
  .dawn.on{opacity:1}

  #stage{position:fixed;inset:0;display:block;z-index:1}

  /* ================= 文字层 ================= */
  .layer{position:fixed;inset:0;z-index:2;pointer-events:none;transition:opacity .9s ease}

  .top{position:absolute;left:0;right:0;top:6vh;text-align:center;opacity:0;transform:translateY(-14px);
    transition:opacity 1.8s ease,transform 1.8s ease}
  .top.on{opacity:1;transform:translateY(0)}
  .top span{font-size:clamp(12px,1.4vw,17px);letter-spacing:.52em;padding-left:.52em;color:#ffd8e6;
    text-shadow:0 0 18px rgba(255,90,140,.95),0 0 46px rgba(255,40,110,.55)}
  .top i{display:block;margin:15px auto 0;width:140px;height:1px;
    background:linear-gradient(90deg,transparent,#ff6f9c,transparent);opacity:.85}

  .stack{position:absolute;left:5vw;right:5vw;display:flex;flex-direction:column;align-items:center;
    gap:min(3.4vh,30px);opacity:0;transition:opacity .6s ease}
  .stack.on{opacity:1}

  /* 诗句 */
  .poem{display:flex;flex-direction:column;gap:clamp(6px,1vh,12px);text-align:center;max-width:92vw}
  .poem p{
    font-family:"Songti SC","Source Han Serif SC","Noto Serif SC","SimSun","STSong",serif;
    font-size:clamp(12.5px,1.05vw + 8.6px,18px);
    line-height:1.85;letter-spacing:.1em;
    color:rgba(255,238,246,.94);
    opacity:0;transform:translateY(12px);filter:blur(7px);
    transition:opacity 1.5s ease,transform 1.5s ease,filter 1.5s ease;
    text-shadow:0 0 20px rgba(255,90,140,.5),0 0 44px rgba(255,40,110,.28)}
  .poem p.on{opacity:1;transform:none;filter:none}
  .poem p.amber{color:#ffe6bc;text-shadow:0 0 22px rgba(255,190,110,.6),0 0 50px rgba(255,120,60,.3)}

  /* 按钮 */
  .btnwrap{opacity:0;transform:translateY(16px) scale(.92);pointer-events:none;
    transition:opacity 1s ease,transform .95s cubic-bezier(.2,1.6,.4,1)}
  .btnwrap.on{opacity:1;transform:translateY(0) scale(1);pointer-events:auto}

  .btn{position:relative;display:inline-block;padding:15px 44px;border:0;border-radius:999px;cursor:pointer;
    font-family:inherit;font-size:clamp(14px,1.5vw,19px);font-weight:800;letter-spacing:.2em;padding-left:calc(44px + .2em);
    color:#fff;background:linear-gradient(135deg,#ff5c8a,#ff2d6f 44%,#ff8a3d);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.4),0 0 24px rgba(255,45,111,.6),0 12px 40px rgba(255,45,111,.42);
    animation:btnPulse 2.4s ease-in-out infinite;overflow:hidden}
  .btn:hover{transform:translateY(-2px) scale(1.04)}
  .btn:active{transform:scale(.97)}
  .btn::after{content:"";position:absolute;inset:0;border-radius:inherit;
    background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.5) 48%,transparent 66%);
    transform:translateX(-120%);animation:shine 3.2s ease-in-out infinite}
  @keyframes shine{0%{transform:translateX(-120%)}55%,100%{transform:translateX(120%)}}
  @keyframes btnPulse{0%,100%{box-shadow:inset 0 0 0 1px rgba(255,255,255,.4),0 0 22px rgba(255,45,111,.55),0 12px 40px rgba(255,45,111,.4)}
    50%{box-shadow:inset 0 0 0 1px rgba(255,255,255,.6),0 0 44px rgba(255,60,130,.9),0 16px 56px rgba(255,45,111,.58)}}

  /* 音乐 */
  .music{position:fixed;right:18px;bottom:16px;z-index:6;width:44px;height:44px;border-radius:50%;cursor:pointer;
    display:flex;align-items:center;justify-content:center;font-size:17px;color:#ffd6e6;
    background:rgba(255,80,140,.12);border:1px solid rgba(255,140,180,.35);
    box-shadow:0 0 18px rgba(255,60,130,.28);backdrop-filter:blur(6px);transition:.3s}
  .music:hover{background:rgba(255,80,140,.28);transform:scale(1.08)}
  .music.on{color:#fff;background:rgba(255,60,130,.45);box-shadow:0 0 26px rgba(255,60,130,.85);animation:spinnote 4s linear infinite}
  @keyframes spinnote{to{transform:rotate(360deg)}}

  /* 终幕 */
  .final{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:22px;opacity:0;pointer-events:none;transition:opacity 1.2s ease;padding:13vh 8vw 0;
    background:radial-gradient(circle at 50% 46%,rgba(58,6,34,.5) 0%,rgba(6,0,12,.86) 74%)}
  .final.on{opacity:1;pointer-events:auto}
  .final h2{font-family:"Songti SC","Source Han Serif SC","Noto Serif SC","SimSun",serif;
    font-size:clamp(28px,4.6vw,58px);letter-spacing:.18em;padding-left:.18em;text-align:center;font-weight:600;
    background:linear-gradient(90deg,#fff,#ffe0c9 28%,#ff9fc4 52%,#fff 78%,#ffe0c9);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 26px rgba(255,110,160,.8));transform:scale(.8);
    transition:transform 1.2s cubic-bezier(.2,1.5,.4,1)}
  .final.on h2{transform:scale(1)}
  .final .fline{display:flex;align-items:center;gap:14px;opacity:0;transition:opacity 1.4s ease .5s}
  .final.on .fline{opacity:1}
  .final .fline b{width:52px;height:1px;background:linear-gradient(90deg,transparent,#ffb3c6)}
  .final .fline b:last-child{background:linear-gradient(90deg,#ffb3c6,transparent)}
  .final .fline span{font-size:clamp(10px,1.1vw,13px);letter-spacing:.5em;padding-left:.5em;color:rgba(255,214,229,.85)}
  .final p{font-family:"Songti SC","Source Han Serif SC","Noto Serif SC","SimSun",serif;
    font-size:clamp(12.5px,1.25vw,17px);letter-spacing:.28em;padding-left:.28em;line-height:2.1;
    color:rgba(255,232,242,.92);text-shadow:0 0 20px rgba(255,70,130,.65);text-align:center}

  .flash{position:fixed;inset:0;z-index:4;pointer-events:none;opacity:0;
    background:radial-gradient(circle at 50% 44%,rgba(255,235,245,.92),rgba(255,120,180,.22) 42%,rgba(255,0,80,0) 72%)}
  .flash.go{animation:flashOut 1s ease-out}
  @keyframes flashOut{0%{opacity:1}100%{opacity:0}}

  @media (max-width:640px){
    .blob{filter:blur(54px);opacity:.42}
    .rays{opacity:.34}
  }
</style>
</head>
<body>

<div class="aurora">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
</div>
<div class="rays"></div>
<div class="halo"></div>
<div class="dawn" id="dawn"></div>
<canvas id="stage"></canvas>

<div class="layer">
  <div class="top" id="top"><span>写 给 小 霞</span><i></i></div>
  <div class="stack" id="stack">
    <div class="poem" id="poem">
      <p>喜欢你这件事，</p>
      <p>我在心里排练了很久的措辞。</p>
      <p>可每次见到你，准备好的话就全忘了。</p>
      <p class="amber">所以这一次，我把它交给满屏的星星。</p>
    </div>
    <div class="btnwrap" id="btnwrap"><button class="btn" id="btnYes">好，你说 ♥</button></div>
  </div>
</div>

<div class="flash" id="flash"></div>

<div class="final" id="final">
  <h2>那就说定了</h2>
  <div class="fline"><b></b><span>从 今 天 起</span><b></b></div>
  <p>剩 下 的 话<br>我 慢 慢 讲 给 你 听</p>
</div>

<div class="music" id="music" title="播放音乐">♪</div>

<script>
(function(){
  'use strict';

  var cvs = document.getElementById('stage');
  var ctx = cvs.getContext('2d');
  var W = 0, H = 0, DPR = 1;
  var MOBILE = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || Math.min(screen.width, screen.height) < 700;
  var MAXP = MOBILE ? 3600 : 8000;

  /* ================= 心形路径 ================= */
  function heartPath(g, r){
    var top = -r, w = r;
    g.beginPath();
    g.moveTo(0, top + r * 0.5);
    g.bezierCurveTo(0, top, -w, top, -w, top + r * 0.5);
    g.bezierCurveTo(-w, 0, 0, r * 0.5, 0, r);
    g.bezierCurveTo(0, r * 0.5, w, 0, w, top + r * 0.5);
    g.bezierCurveTo(w, top, 0, top, 0, top + r * 0.5);
    g.closePath();
  }

  /* ================= 精灵：冷调 / 暖调 ================= */
  var COOL = ['#ff2d6f','#ff2d6f','#ff2d6f','#ff3d78','#ff4d7d','#ff2d6f','#ff5c8a','#ff1f5a','#ff7a95'];
  var WARM = ['#ff8a3d','#ffb703','#ffd166','#ffe066','#ff7a45','#ff9e7a','#ffc2a0'];
  var SPR = [], SPRW = [];
  function makeSprite(color){
    var S = 64, cv = document.createElement('canvas');
    cv.width = cv.height = S;
    var g = cv.getContext('2d');
    g.translate(S / 2, S / 2);
    g.shadowColor = color; g.shadowBlur = 7;
    g.fillStyle = color;
    heartPath(g, S * 0.33);
    g.fill();
    return cv;
  }
  COOL.forEach(function(c){ SPR.push(makeSprite(c)); });
  WARM.forEach(function(c){ SPRW.push(makeSprite(c)); });

  /* ================= 星空 / 萤火 / 花瓣 / 流星 ================= */
  var STARS = [], FIRE = [], PETALS = [], METEORS = [];
  function buildStars(){
    STARS = [];
    var n = Math.round(Math.min(240, W * H / 7600));
    for (var i = 0; i < n; i++){
      STARS.push({
        x: Math.random() * W, y: Math.random() * H,
        r: 0.4 + Math.random() * 1.7,
        z: 0.35 + Math.random() * 0.85,
        ph: Math.random() * 6.283, sp: 0.5 + Math.random() * 1.7,
        hue: Math.random() < 0.45 ? '255,206,228' : '255,246,238'
      });
    }
  }
  function buildFire(){
    FIRE = [];
    var n = MOBILE ? 22 : 38;
    for (var i = 0; i < n; i++){
      FIRE.push({
        x: Math.random() * W, y: Math.random() * H,
        vy: -(0.12 + Math.random() * 0.35), sw: Math.random() * 6.283,
        ph: Math.random() * 6.283, r: 1 + Math.random() * 2.1
      });
    }
  }
  function buildPetals(){
    PETALS = [];
    var n = Math.round(Math.min(26, Math.max(10, W / 46)));
    for (var i = 0; i < n; i++){
      PETALS.push({
        x: Math.random() * W, y: Math.random() * H,
        s: 4 + Math.random() * 8,
        vy: 0.22 + Math.random() * 0.7, vx: (Math.random() - 0.5) * 0.5,
        rot: Math.random() * 6.283, vr: (Math.random() - 0.5) * 0.022,
        sw: Math.random() * 6.283, a: 0.2 + Math.random() * 0.42
      });
    }
  }
  function spawnMeteor(){
    var fromLeft = Math.random() < 0.5;
    var y0 = Math.random() * H * 0.45;
    var sp = 9 + Math.random() * 7;
    METEORS.push({
      x: fromLeft ? -60 : W + 60,
      y: y0,
      vx: (fromLeft ? 1 : -1) * sp,
      vy: sp * (0.45 + Math.random() * 0.35),
      life: 1, dec: 0.008 + Math.random() * 0.006,
      len: 90 + Math.random() * 130
    });
  }

  /* ================= 主粒子 ================= */
  var P = [];
  function resetParticles(n){
    P = [];
    var cx = W / 2, cy = H / 2;
    for (var i = 0; i < n; i++){
      var a = Math.random() * 6.283, sp = 1.5 + Math.random() * 8;
      P.push({
        x: cx + (Math.random() - 0.5) * 70,
        y: cy + (Math.random() - 0.5) * 70,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        tx: cx, ty: cy, hasT: false, die: false,
        warm: false, si: (Math.random() * SPR.length) | 0,
        sz: 9 + Math.random() * 8,
        rot: Math.random() * 6.283, spin: (Math.random() - 0.5) * 0.07,
        ph: Math.random() * 6.283,
        km: 0.85 + Math.random() * 0.42,
        a: 0.72 + Math.random() * 0.28
      });
    }
  }

  /* ================= 阶段 ================= */
  var stage = 'burst';
  var textInfo = null;
  var LANES = { portrait: ['小霞', '我喜欢你'], wide: ['小霞我喜欢你'] };

  function toHeart(){
    stage = 'heart';
    var cx = W / 2, cy = H * 0.44;
    var s = (Math.min(W, H) * 0.58) / 32;
    var n = P.length;
    for (var i = 0; i < n; i++){
      var p = P[i];
      if (p.die) continue;
      var t = (i / n) * 6.28318;
      var hx = 16 * Math.pow(Math.sin(t), 3);
      var hy = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
      var j = 0.90 + Math.random() * 0.12;
      p.tx = cx + hx * s * j + (Math.random() - 0.5) * 4;
      p.ty = cy - hy * s * j + (Math.random() - 0.5) * 4;
      p.hasT = true;
      p.sz = 9 + Math.random() * 8;
      p.a = 0.5 + Math.random() * 0.28;
      p.warm = Math.random() < 0.22;
      if (p.warm) p.si = (Math.random() * SPRW.length) | 0;
    }
    shock(cx, cy, Math.min(W, H) * 0.55);
  }

  function burstHeart(){
    stage = 'broken';
    var cx = W / 2, cy = H * 0.44;
    for (var i = 0; i < P.length; i++){
      var p = P[i];
      if (p.die) continue;
      var a = Math.random() * 6.283, sp = 3 + Math.random() * 11;
      p.hasT = false;
      p.vx = Math.cos(a) * sp;
      p.vy = Math.sin(a) * sp;
    }
    shock(cx, cy, Math.min(W, H) * 0.85);
    flash();
  }

  function buildTextPoints(){
    var portrait = H > W * 1.02;
    var lines = portrait ? LANES.portrait : LANES.wide;
    var maxChars = 1;
    for (var i = 0; i < lines.length; i++) maxChars = Math.max(maxChars, lines[i].length);

    var off = document.createElement('canvas');
    off.width = Math.max(2, Math.ceil(W));
    off.height = Math.max(2, Math.ceil(H));
    var g = off.getContext('2d');
    var FONT = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Heiti SC","Noto Sans CJK SC",sans-serif';

    /* 用 measureText 实测宽度，自动缩到不溢出 */
    var maxW = W * 0.86;
    var maxH = H * (portrait ? 0.30 : 0.30);
    var fs = Math.min(maxW / Math.max(1, maxChars), maxH / Math.max(1, lines.length));
    for (var guard = 0; guard < 40; guard++){
      g.font = '800 ' + fs.toFixed(1) + 'px ' + FONT;
      try { g.letterSpacing = (fs * 0.06).toFixed(1) + 'px'; } catch (e) {}
      var widest = 0;
      for (var li0 = 0; li0 < lines.length; li0++){
        var mw = g.measureText(lines[li0]).width;
        if (mw > widest) widest = mw;
      }
      var totalH = fs * 1.18 * lines.length;
      if ((widest <= maxW && totalH <= maxH) || fs < 14) break;
      fs *= Math.min(0.97, Math.max(0.5, Math.min(maxW / Math.max(widest, 1), maxH / Math.max(totalH, 1))));
    }
    fs = Math.max(fs, 16);
    var lh = fs * 1.18;
    var cx = W / 2, cy = H * (portrait ? 0.37 : 0.40);
    var startY = cy - (lines.length - 1) * lh / 2;

    g.font = '800 ' + fs.toFixed(1) + 'px ' + FONT;
    try { g.letterSpacing = (fs * 0.06).toFixed(1) + 'px'; } catch (e) {}
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.fillStyle = '#fff';
    for (var li = 0; li < lines.length; li++) g.fillText(lines[li], cx, startY + li * lh);

    var data = g.getImageData(0, 0, off.width, off.height).data;
    var pts = [], step = 2;
    for (var y = 0; y < off.height; y += step){
      var row = y * off.width * 4;
      for (var x = 0; x < off.width; x += step){
        if (data[row + x * 4 + 3] > 130) pts.push(x, y);
      }
    }
    var total = pts.length / 2;
    var idxs = [];
    for (var k = 0; k < total; k++) idxs.push(k);
    for (var m = total - 1; m > 0; m--){
      var r = (Math.random() * (m + 1)) | 0;
      var tmp = idxs[m]; idxs[m] = idxs[r]; idxs[r] = tmp;
    }
    var take = Math.min(total, MAXP);
    var out = [];
    for (var q = 0; q < take; q++){
      var id = idxs[q];
      out.push(pts[id * 2], pts[id * 2 + 1]);
    }
    var spacing = total > 0 ? 2 * (total / Math.max(1, take)) : 6;
    return {
      pts: out, count: take, fs: fs, spacing: spacing, cx: cx, widest: (typeof widest === 'number' ? widest : 0),
      bottom: startY + (lines.length - 1) * lh + fs * 0.64
    };
  }

  function toText(){
    stage = 'text';
    var info = buildTextPoints();
    textInfo = info;
    var n = info.count;
    var base = Math.max(6, Math.min(13, info.spacing * 1.9));
    for (var i = 0; i < P.length; i++){
      var p = P[i];
      if (i < n){
        p.tx = info.pts[i * 2] + (Math.random() - 0.5) * 1.4;
        p.ty = info.pts[i * 2 + 1] + (Math.random() - 0.5) * 1.4;
        p.hasT = true;
        p.sz = base * (0.9 + Math.random() * 0.3);
        p.a = 0.88 + Math.random() * 0.12;
        p.rot = (Math.random() - 0.5) * 0.35;
        p.spin = 0;
        p.warm = Math.random() < 0.07;
        if (p.warm) p.si = (Math.random() * SPRW.length) | 0;
      } else {
        p.hasT = false;
        p.die = true;
        p.vy -= 1.4;
        p.vx += (Math.random() - 0.5) * 1.6;
      }
    }
    placeStack(info);
  }

  function placeStack(info){
    var stack = document.getElementById('stack');
    var y = info.bottom + Math.max(20, info.fs * 0.22);
    y = Math.min(y, H - (H < 640 ? 210 : 270));
    stack.style.top = y + 'px';
    stack.classList.add('on');
  }

  /* ================= 火花 / 冲击波 ================= */
  var SPK = [];
  function spawnBurst(x, y, n, power){
    for (var i = 0; i < n; i++){
      var a = Math.random() * 6.283, sp = Math.random() * power;
      SPK.push({
        x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        rot: Math.random() * 6.283, spin: (Math.random() - 0.5) * 0.22,
        sz: 7 + Math.random() * 13,
        warm: Math.random() < 0.5,
        si: ((Math.random() * 9) | 0) % (Math.random() < 0.5 ? SPR.length : SPRW.length),
        life: 1, dec: 0.005 + Math.random() * 0.011
      });
    }
  }
  var SHOCK = [];
  function shock(x, y, max, alpha){ SHOCK.push({ x: x, y: y, r: 6, max: max, a: alpha || 1 }); }

  function flash(){
    var f = document.getElementById('flash');
    f.classList.remove('go');
    void f.offsetWidth;
    f.classList.add('go');
  }

  /* ================= 尺寸 ================= */
  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    cvs.width = Math.round(W * DPR);
    cvs.height = Math.round(H * DPR);
    cvs.style.width = W + 'px';
    cvs.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    buildStars(); buildFire(); buildPetals();
  }

  /* ================= 交互 ================= */
  var ptr = { x: -9999, y: -9999, on: false };
  window.addEventListener('pointermove', function(e){
    ptr.x = e.clientX; ptr.y = e.clientY; ptr.on = true;
  }, { passive: true });
  window.addEventListener('pointerdown', function(e){
    ptr.x = e.clientX; ptr.y = e.clientY; ptr.on = true;
    spawnBurst(e.clientX, e.clientY, MOBILE ? 24 : 38, 6);
    shock(e.clientX, e.clientY, Math.min(W, H) * 0.22, 0.7);
  }, { passive: true });
  window.addEventListener('pointerleave', function(){ ptr.on = false; });

  /* ================= 音乐 ================= */
  var AC = null, musicTimer = null, musicOn = false;
  var MELODY = [0, 4, 7, 9, 12, 9, 7, 4, 2, 5, 9, 12, 16, 12, 9, 5];
  function startMusic(){
    try{
      if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
      if (AC.state === 'suspended') AC.resume();
    } catch (err){ return; }
    musicOn = true;
    var base = 261.63, idx = 0;
    function play(){
      if (!musicOn || !AC) return;
      var semi = MELODY[idx % MELODY.length]; idx++;
      var f = base * Math.pow(2, semi / 12);
      var t0 = AC.currentTime;
      for (var k = 0; k < 2; k++){
        var o = AC.createOscillator(), g = AC.createGain();
        o.type = k === 0 ? 'sine' : 'triangle';
        o.frequency.value = f * (k === 0 ? 1 : 2);
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.linearRampToValueAtTime(k === 0 ? 0.08 : 0.026, t0 + 0.035);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.9);
        o.connect(g); g.connect(AC.destination);
        o.start(t0); o.stop(t0 + 2.0);
      }
      musicTimer = setTimeout(play, 660);
    }
    play();
  }
  function stopMusic(){ musicOn = false; if (musicTimer) clearTimeout(musicTimer); }
  var musicBtn = document.getElementById('music');
  musicBtn.addEventListener('click', function(e){
    e.stopPropagation();
    if (musicOn){ stopMusic(); musicBtn.classList.remove('on'); }
    else { startMusic(); musicBtn.classList.add('on'); }
  });

  /* ================= 按钮 ================= */
  document.getElementById('btnYes').addEventListener('click', function(e){
    e.stopPropagation();
    document.getElementById('btnwrap').classList.remove('on');
    document.querySelector('.layer').style.opacity = '0';
    setTimeout(function(){ document.getElementById('final').classList.add('on'); }, 340);
    for (var i = 0; i < 10; i++){
      (function(i){
        setTimeout(function(){
          spawnBurst(W * (0.12 + Math.random() * 0.76), H * (0.12 + Math.random() * 0.5), MOBILE ? 50 : 85, 9);
          if (i % 3 === 0) shock(W / 2, H * 0.44, Math.min(W, H) * 0.7, 0.6);
          if (i % 4 === 1) spawnMeteor();
        }, i * 260);
      })(i);
    }
  });

  /* ================= 更新 ================= */
  var meteorTimer = 0, rippleTimer = 0;

  function update(dt, t){
    var mk = Math.min(dt / 16.67, 2.6);
    var damp = Math.pow(0.90, mk);
    var i, p;

    for (i = 0; i < P.length; i++){
      p = P[i];
      if (p.die){
        p.a *= Math.pow(0.93, mk);
        if (p.a < 0.02) continue;
        p.vx *= Math.pow(0.985, mk);
        p.vy = p.vy * Math.pow(0.985, mk) + 0.01 * mk;
        p.x += p.vx * mk; p.y += p.vy * mk;
        p.rot += p.spin * mk;
        continue;
      }
      if (p.hasT){
        var wob = (stage === 'text') ? Math.sin(t * 0.0016 + p.ph) * 1.1 : 0;
        var dx = (p.tx + wob) - p.x;
        var dy = (p.ty + Math.cos(t * 0.0013 + p.ph) * 0.9 * (stage === 'text' ? 1 : 0)) - p.y;
        var k = 0.045 * p.km * mk;
        p.vx = (p.vx + dx * k) * damp;
        p.vy = (p.vy + dy * k) * damp;
      } else {
        p.vx *= Math.pow(0.987, mk);
        p.vy = p.vy * Math.pow(0.987, mk) + 0.015 * mk;
      }
      if (ptr.on){
        var ddx = p.x - ptr.x, ddy = p.y - ptr.y;
        var d2 = ddx * ddx + ddy * ddy;
        if (d2 < 16900 && d2 > 1){
          var d = Math.sqrt(d2);
          var f = (1 - d / 130) * 2.6;
          p.vx += (ddx / d) * f * mk;
          p.vy += (ddy / d) * f * mk;
        }
      }
      p.x += p.vx * mk;
      p.y += p.vy * mk;
      p.rot += p.spin * mk;
    }

    for (i = SPK.length - 1; i >= 0; i--){
      var s = SPK[i];
      s.vx *= Math.pow(0.975, mk);
      s.vy = s.vy * Math.pow(0.975, mk) + 0.05 * mk;
      s.x += s.vx * mk; s.y += s.vy * mk;
      s.rot += s.spin * mk;
      s.life -= s.dec * mk;
      if (s.life <= 0) SPK.splice(i, 1);
    }

    for (i = SHOCK.length - 1; i >= 0; i--){
      var w = SHOCK[i];
      w.r += (w.max - w.r) * 0.055 * mk;
      w.a -= 0.016 * mk;
      if (w.a <= 0) SHOCK.splice(i, 1);
    }

    for (i = 0; i < PETALS.length; i++){
      var pt = PETALS[i];
      pt.y += pt.vy * mk;
      pt.x += (pt.vx + Math.sin(t * 0.0009 + pt.sw) * 0.5) * mk;
      pt.rot += pt.vr * mk;
      if (pt.y > H + 30){ pt.y = -30; pt.x = Math.random() * W; }
      if (pt.x < -40) pt.x = W + 30;
      if (pt.x > W + 40) pt.x = -30;
    }

    for (i = 0; i < FIRE.length; i++){
      var fi = FIRE[i];
      fi.y += fi.vy * mk;
      fi.x += Math.sin(t * 0.0007 + fi.sw) * 0.32 * mk;
      if (fi.y < -20){ fi.y = H + 20; fi.x = Math.random() * W; }
    }

    for (i = METEORS.length - 1; i >= 0; i--){
      var me = METEORS[i];
      me.x += me.vx * mk;
      me.y += me.vy * mk;
      me.life -= me.dec * mk;
      if (me.life <= 0 || me.x < -200 || me.x > W + 200 || me.y > H + 200) METEORS.splice(i, 1);
    }
    meteorTimer -= dt;
    if (meteorTimer <= 0){
      meteorTimer = 2200 + Math.random() * 2600;
      if (METEORS.length < 4) spawnMeteor();
    }

    if (stage === 'text'){
      rippleTimer -= dt;
      if (rippleTimer <= 0){
        rippleTimer = 2100;
        if (textInfo) shock(textInfo.cx, H * 0.40, Math.min(W, H) * 0.46, 0.35);
      }
    }
  }

  /* ================= 绘制 ================= */
  function draw(t){
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';

    /* 星空 */
    for (var i = 0; i < STARS.length; i++){
      var st = STARS[i];
      var tw = 0.3 + 0.7 * (0.5 + 0.5 * Math.sin(t * 0.0022 * st.sp + st.ph));
      ctx.globalAlpha = tw * 0.8;
      ctx.fillStyle = 'rgba(' + st.hue + ',1)';
      ctx.beginPath();
      ctx.arc(st.x, st.y, st.r * st.z, 0, 6.283);
      ctx.fill();
    }

    /* 萤火虫 */
    for (var f2 = 0; f2 < FIRE.length; f2++){
      var fl = FIRE[f2];
      var a2 = 0.25 + 0.55 * (0.5 + 0.5 * Math.sin(t * 0.0026 + fl.ph));
      ctx.globalAlpha = a2;
      ctx.fillStyle = 'rgba(255,214,150,1)';
      ctx.beginPath();
      ctx.arc(fl.x, fl.y, fl.r, 0, 6.283);
      ctx.fill();
      ctx.globalAlpha = a2 * 0.25;
      ctx.beginPath();
      ctx.arc(fl.x, fl.y, fl.r * 3.4, 0, 6.283);
      ctx.fill();
    }

    /* 花瓣 */
    ctx.globalCompositeOperation = 'source-over';
    for (var j = 0; j < PETALS.length; j++){
      var pe = PETALS[j];
      var ca = Math.cos(pe.rot), sa = Math.sin(pe.rot), sz = pe.s;
      ctx.setTransform(DPR * ca, DPR * sa, -DPR * sa, DPR * ca, DPR * pe.x, DPR * pe.y);
      ctx.globalAlpha = pe.a;
      var grd = ctx.createLinearGradient(0, -sz * 1.25, 0, sz * 1.3);
      grd.addColorStop(0, 'rgba(255,238,244,0.95)');
      grd.addColorStop(0.45, 'rgba(255,146,184,0.95)');
      grd.addColorStop(1, 'rgba(226,40,100,0.92)');
      ctx.fillStyle = grd;
      ctx.beginPath();
      ctx.moveTo(0, -sz * 1.28);
      ctx.bezierCurveTo(sz * 1.35, -sz * 0.55, sz * 1.1, sz * 0.95, 0, sz * 1.3);
      ctx.bezierCurveTo(-sz * 1.1, sz * 0.95, -sz * 1.35, -sz * 0.55, 0, -sz * 1.28);
      ctx.closePath();
      ctx.fill();
      ctx.globalAlpha = pe.a * 0.5;
      ctx.strokeStyle = 'rgba(255,255,255,0.9)';
      ctx.lineWidth = Math.max(0.6, sz * 0.09);
      ctx.beginPath();
      ctx.moveTo(0, -sz * 1.1);
      ctx.quadraticCurveTo(sz * 0.25, 0, 0, sz * 1.05);
      ctx.stroke();
    }
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.globalCompositeOperation = 'lighter';

    /* 流星 */
    for (var m2 = 0; m2 < METEORS.length; m2++){
      var mm = METEORS[m2];
      var nx = mm.vx / Math.hypot(mm.vx, mm.vy), ny = mm.vy / Math.hypot(mm.vx, mm.vy);
      var tx2 = mm.x - nx * mm.len, ty2 = mm.y - ny * mm.len;
      var g2 = ctx.createLinearGradient(mm.x, mm.y, tx2, ty2);
      g2.addColorStop(0, 'rgba(255,255,255,' + (0.85 * mm.life) + ')');
      g2.addColorStop(0.35, 'rgba(255,190,220,' + (0.35 * mm.life) + ')');
      g2.addColorStop(1, 'rgba(255,140,190,0)');
      ctx.strokeStyle = g2;
      ctx.lineWidth = 2.1;
      ctx.beginPath();
      ctx.moveTo(mm.x, mm.y);
      ctx.lineTo(tx2, ty2);
      ctx.stroke();
      ctx.globalAlpha = 0.9 * mm.life;
      ctx.fillStyle = 'rgba(255,255,255,1)';
      ctx.beginPath();
      ctx.arc(mm.x, mm.y, 1.7, 0, 6.283);
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    /* 冲击波 */
    for (var k = 0; k < SHOCK.length; k++){
      var sh = SHOCK[k];
      ctx.globalAlpha = Math.max(0, sh.a) * 0.45;
      ctx.strokeStyle = 'rgba(255,150,190,1)';
      ctx.lineWidth = 1 + sh.a * 3.5;
      ctx.beginPath();
      ctx.arc(sh.x, sh.y, sh.r, 0, 6.283);
      ctx.stroke();
    }

    /* 主粒子 */
    var textMode = (stage === 'text');
    ctx.globalCompositeOperation = textMode ? 'source-over' : 'lighter';
    var hb = textMode ? (1 + 0.014 * Math.sin(t * 0.0042)) : 1;

    for (var n = 0; n < P.length; n++){
      var p = P[n];
      if (p.die && p.a < 0.02) continue;

      var sp2 = Math.hypot(p.vx, p.vy);
      if (!textMode && sp2 > 1.8 && n % 2 === 0){
        ctx.globalAlpha = 0.22;
        ctx.strokeStyle = p.warm ? 'rgba(255,200,120,1)' : 'rgba(255,110,160,1)';
        ctx.lineWidth = Math.max(1, p.sz * 0.22);
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x - p.vx * 2.6, p.y - p.vy * 2.6);
        ctx.stroke();
      }

      var tw2 = textMode ? (0.94 + 0.06 * Math.sin(t * 0.0022 + p.ph)) : (0.86 + 0.14 * Math.sin(t * 0.0032 + p.ph));
      var wave = textMode ? (1 + 0.16 * Math.sin(t * 0.0021 - p.x * 0.012)) : 1;
      var s2 = p.sz * tw2 * wave * hb;
      var c2 = Math.cos(p.rot), s3 = Math.sin(p.rot);
      ctx.setTransform(DPR * c2 * s2 / 64, DPR * s3 * s2 / 64, -DPR * s3 * s2 / 64, DPR * c2 * s2 / 64, DPR * p.x, DPR * p.y);
      ctx.globalAlpha = Math.min(1, p.a * (textMode ? 1 : tw2));
      ctx.drawImage(p.warm ? SPRW[p.si] : SPR[p.si], -32, -32, 64, 64);
    }

    /* 火花 */
    ctx.globalCompositeOperation = 'lighter';
    for (var q = 0; q < SPK.length; q++){
      var s4 = SPK[q];
      var c3 = Math.cos(s4.rot), sn = Math.sin(s4.rot), sz2 = s4.sz * (0.6 + s4.life * 0.6);
      ctx.setTransform(DPR * c3 * sz2 / 64, DPR * sn * sz2 / 64, -DPR * sn * sz2 / 64, DPR * c3 * sz2 / 64, DPR * s4.x, DPR * s4.y);
      ctx.globalAlpha = Math.max(0, Math.min(1, s4.life));
      ctx.drawImage(s4.warm ? SPRW[s4.si] : SPR[s4.si], -32, -32, 64, 64);
    }

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  /* ================= 时间线 ================= */
  var poemLines = document.querySelectorAll('#poem p');
  function showLine(i){
    if (poemLines[i]) poemLines[i].classList.add('on');
  }

  var TL = [
    { t: 600,  fn: function(){ document.getElementById('top').classList.add('on'); } },
    { t: 1000, fn: toHeart },
    { t: 3600, fn: burstHeart },
    { t: 4400, fn: toText },
    { t: 5600, fn: function(){ document.getElementById('dawn').classList.add('on'); } },
    { t: 6000, fn: function(){ showLine(0); } },
    { t: 7400, fn: function(){ showLine(1); } },
    { t: 8800, fn: function(){ showLine(2); } },
    { t: 10200, fn: function(){ showLine(3); } },
    { t: 12000, fn: function(){ document.getElementById('btnwrap').classList.add('on'); } }
  ];
  var start = performance.now();
  var last = start;
  var fired = [];

  function fireTL(t){
    for (var i = 0; i < TL.length; i++){
      if (!fired[i] && t >= TL[i].t){ fired[i] = true; try{ TL[i].fn(); }catch(e){} }
    }
  }

  function loop(now){
    var t = now - start;
    var dt = Math.min(now - last, 70);
    last = now;
    fireTL(t);
    if (stage === 'text' && textInfo && textInfo.count > 0 && Math.random() < 0.035){
      var sx = (Math.random() * textInfo.count) | 0;
      spawnBurst(textInfo.pts[sx * 2], textInfo.pts[sx * 2 + 1], MOBILE ? 2 : 3, 3.2);
    }
    update(dt, t);
    draw(t);
    requestAnimationFrame(loop);
  }

  /* ================= 启动 ================= */
  resize();
  resetParticles(MAXP);

  var FF = 0;
  try { FF = parseInt((location.search.match(/[?&]ff=(\d+)/) || [0, 0])[1], 10) || 0; } catch (e) {}
  if (FF > 0){
    var stl = document.createElement('style');
    stl.textContent = '*{transition:none !important;animation:none !important}';
    document.head.appendChild(stl);
    var acc = 0, stp = 33;
    while (acc < FF){ acc += stp; fireTL(acc); update(stp, acc); }
    draw(acc);
    start = performance.now() - acc;
    last = performance.now();
    if (/[?&]click=1/.test(location.search)){
      try { document.getElementById('btnYes').click(); } catch (e) {}
      var acc2 = 0;
      while (acc2 < 2600){ acc2 += stp; update(stp, acc + acc2); }
      draw(acc + acc2);
      start = performance.now() - (acc + acc2);
      last = performance.now();
    }
  }

  requestAnimationFrame(loop);
  setTimeout(function(){ spawnBurst(W / 2, H / 2, MOBILE ? 50 : 80, 8); }, 60);
  setTimeout(function(){ spawnMeteor(); }, 400);
  setTimeout(function(){ spawnMeteor(); }, 1600);

  var rt = null;
  window.addEventListener('resize', function(){
    if (rt) clearTimeout(rt);
    rt = setTimeout(function(){
      resize();
      if (stage === 'heart') toHeart();
      else if (stage === 'text') toText();
    }, 220);
  });
})();
</script>
</body>
</html>
