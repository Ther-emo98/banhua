<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>小霞，这些话我想说给你听 ♥</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:radial-gradient(circle at 50% 42%,#2b0b29 0%,#12041a 46%,#06020b 100%)}
  body{
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
    color:#fff;cursor:pointer;user-select:none;-webkit-user-select:none
  }

  /* ============ 背景：极光 + 光环 + 旋转光束 ============ */
  .aurora{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
  .blob{position:absolute;border-radius:50%;filter:blur(80px);opacity:.5;mix-blend-mode:screen;will-change:transform}
  .b1{width:70vmax;height:70vmax;left:-22vmax;top:-26vmax;background:radial-gradient(circle,#ff2d6f 0%,rgba(255,45,111,0) 65%);animation:drift1 22s ease-in-out infinite alternate}
  .b2{width:62vmax;height:62vmax;right:-20vmax;top:-12vmax;background:radial-gradient(circle,#8a2be2 0%,rgba(138,43,226,0) 65%);animation:drift2 26s ease-in-out infinite alternate}
  .b3{width:66vmax;height:66vmax;left:16vmax;bottom:-32vmax;background:radial-gradient(circle,#ff8c00 0%,rgba(255,140,0,0) 62%);opacity:.3;animation:drift3 30s ease-in-out infinite alternate}
  @keyframes drift1{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(12vmax,8vmax,0) scale(1.2)}}
  @keyframes drift2{from{transform:translate3d(0,0,0) scale(1.1)}to{transform:translate3d(-14vmax,10vmax,0) scale(.9)}}
  @keyframes drift3{from{transform:translate3d(0,0,0) scale(.95)}to{transform:translate3d(10vmax,-12vmax,0) scale(1.15)}}

  .rays{position:fixed;left:50%;top:46%;width:170vmax;height:170vmax;transform:translate(-50%,-50%);
    background:repeating-conic-gradient(from 0deg,rgba(255,120,170,.15) 0deg 2.6deg,rgba(255,120,170,0) 2.6deg 11deg);
    -webkit-mask-image:radial-gradient(circle,rgba(0,0,0,.95) 0%,rgba(0,0,0,0) 60%);
    mask-image:radial-gradient(circle,rgba(0,0,0,.95) 0%,rgba(0,0,0,0) 60%);
    animation:spin 46s linear infinite;z-index:0;pointer-events:none;opacity:.55;mix-blend-mode:screen}
  @keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}

  .halo{position:fixed;left:50%;top:46%;width:130vmin;height:130vmin;transform:translate(-50%,-50%);
    background:radial-gradient(circle,rgba(255,95,145,.26) 0%,rgba(255,60,120,.1) 36%,rgba(255,0,90,0) 68%);
    animation:breathe 4.6s ease-in-out infinite;pointer-events:none;z-index:0;mix-blend-mode:screen}
  @keyframes breathe{0%,100%{opacity:.5;transform:translate(-50%,-50%) scale(.92)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.07)}}

  #stage{position:fixed;inset:0;display:block;z-index:1}

  /* ============ 文字层 ============ */
  .layer{position:fixed;inset:0;z-index:2;pointer-events:none}
  .top{position:absolute;left:0;right:0;top:6.5vh;text-align:center;opacity:0;transform:translateY(-14px);
    transition:opacity 1.7s ease,transform 1.7s ease}
  .top.on{opacity:1;transform:translateY(0)}
  .top span{font-size:clamp(12px,1.4vw,17px);letter-spacing:.52em;padding-left:.52em;color:#ffd8e6;
    text-shadow:0 0 18px rgba(255,90,140,.95),0 0 46px rgba(255,40,110,.55)}
  .top i{display:block;margin:15px auto 0;width:130px;height:1px;
    background:linear-gradient(90deg,transparent,#ff6f9c,transparent);opacity:.85}

  .sub{position:absolute;left:0;right:0;text-align:center;opacity:0;transform:translateY(16px);
    transition:opacity 1.5s ease .15s,transform 1.5s ease .15s}
  .sub.on{opacity:1;transform:translateY(0)}
  .sub .en{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:clamp(15px,2.1vw,27px);
    letter-spacing:.13em;color:#ffe8f1;text-shadow:0 0 22px rgba(255,80,140,.95),0 0 56px rgba(255,20,90,.6)}
  .sub .cn{margin-top:11px;font-size:clamp(10px,1.1vw,14px);letter-spacing:.44em;padding-left:.44em;
    color:rgba(255,205,225,.72)}

  .btnwrap{position:absolute;left:0;right:0;text-align:center;opacity:0;pointer-events:none;
    transform:translateY(18px) scale(.92);
    transition:opacity 1s ease,transform .95s cubic-bezier(.2,1.6,.4,1)}
  .btnwrap.on{opacity:1;transform:translateY(0) scale(1);pointer-events:auto}

  .btn{position:relative;display:inline-block;padding:16px 48px;border:0;border-radius:999px;cursor:pointer;
    font-family:inherit;font-size:clamp(15px,1.6vw,20px);font-weight:800;letter-spacing:.18em;padding-left:calc(48px + .18em);
    color:#fff;background:linear-gradient(135deg,#ff4d88,#ff2d6f 42%,#ff7a45);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.4),0 0 24px rgba(255,45,111,.65),0 12px 40px rgba(255,45,111,.45);
    animation:btnPulse 2.1s ease-in-out infinite;overflow:hidden}
  .btn:hover{transform:translateY(-2px) scale(1.04)}
  .btn:active{transform:scale(.97)}
  .btn::after{content:"";position:absolute;inset:0;border-radius:inherit;
    background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.55) 48%,transparent 66%);
    transform:translateX(-120%);animation:shine 2.8s ease-in-out infinite}
  @keyframes shine{0%{transform:translateX(-120%)}55%,100%{transform:translateX(120%)}}
  @keyframes btnPulse{0%,100%{box-shadow:inset 0 0 0 1px rgba(255,255,255,.4),0 0 22px rgba(255,45,111,.6),0 12px 40px rgba(255,45,111,.42)}
    50%{box-shadow:inset 0 0 0 1px rgba(255,255,255,.6),0 0 44px rgba(255,60,130,.95),0 16px 56px rgba(255,45,111,.6)}}

  /* 音乐开关 */
  .music{position:fixed;right:20px;bottom:18px;z-index:6;width:44px;height:44px;border-radius:50%;cursor:pointer;
    display:flex;align-items:center;justify-content:center;font-size:17px;color:#ffd6e6;
    background:rgba(255,80,140,.12);border:1px solid rgba(255,140,180,.35);
    box-shadow:0 0 18px rgba(255,60,130,.28);backdrop-filter:blur(6px);transition:.3s}
  .music:hover{background:rgba(255,80,140,.28);transform:scale(1.08)}
  .music.on{color:#fff;background:rgba(255,60,130,.45);box-shadow:0 0 26px rgba(255,60,130,.85);animation:spinnote 3s linear infinite}
  @keyframes spinnote{to{transform:rotate(360deg)}}

  /* 终幕 */
  .final{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:20px;opacity:0;pointer-events:none;transition:opacity 1.1s ease;
    background:radial-gradient(circle at 50% 46%,rgba(80,0,40,.55) 0%,rgba(8,0,14,.86) 70%)}
  .final.on{opacity:1;pointer-events:auto}
  .final h2{font-size:clamp(26px,5vw,62px);font-weight:800;letter-spacing:.12em;padding-left:.12em;text-align:center;
    background:linear-gradient(90deg,#fff,#ffd6e6 30%,#ff8fbe 55%,#fff 80%,#ffd6e6);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 28px rgba(255,90,150,.85));transform:scale(.78);
    transition:transform 1.15s cubic-bezier(.2,1.5,.4,1)}
  .final.on h2{transform:scale(1)}
  .final .line{display:flex;align-items:center;gap:14px;opacity:0;transition:opacity 1.2s ease .5s}
  .final.on .line{opacity:1}
  .final .line b{width:60px;height:1px;background:linear-gradient(90deg,transparent,#ff8fbe)}
  .final .line b:last-child{background:linear-gradient(90deg,#ff8fbe,transparent)}
  .final p{font-size:clamp(12px,1.35vw,17px);letter-spacing:.4em;padding-left:.4em;color:rgba(255,225,238,.9);
    text-shadow:0 0 20px rgba(255,70,130,.7);text-align:center}

  @media (max-width:640px){
    .blob{filter:blur(54px);opacity:.42}
    .rays{opacity:.36}
  }

  .flash{position:fixed;inset:0;z-index:4;pointer-events:none;opacity:0;
    background:radial-gradient(circle at 50% 46%,rgba(255,235,245,.95),rgba(255,120,180,.25) 40%,rgba(255,0,80,0) 70%)}
  .flash.go{animation:flashOut .9s ease-out}
  @keyframes flashOut{0%{opacity:1}100%{opacity:0}}
</style>
</head>
<body>

<div class="aurora">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
</div>
<div class="rays"></div>
<div class="halo"></div>
<canvas id="stage"></canvas>

<div class="layer">
  <div class="top"><span>写 给 心 里 最 好 的 小 霞</span><i></i></div>
  <div class="sub">
    <div class="en">Since I met you, every day has a little light in it.</div>
    <div class="cn">遇 见 你 之 后 · 每 天 都 有 了 期 待</div>
  </div>
  <div class="btnwrap"><button class="btn" id="btnYes">我 也 喜 欢 你 ♥</button></div>
</div>

<div class="flash" id="flash"></div>

<div class="final" id="final">
  <h2>太好啦，那我们就在一起吧！</h2>
  <div class="line"><b></b><p>往 后 的 每 个 明 天 · 都 想 有 你</p><b></b></div>
</div>

<div class="music" id="music" title="播放浪漫音乐">♪</div>

<script>
(function(){
  'use strict';

  var cvs = document.getElementById('stage');
  var ctx = cvs.getContext('2d');
  var W = 0, H = 0, DPR = 1;
  var MOBILE = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || Math.min(screen.width, screen.height) < 700;
  var MAXP = MOBILE ? 2600 : 9000;

  /* ================= 心形路径 ================= */
  function heartPath(g, r){
    var top = -r, w = r;
    g.beginPath();
    g.moveTo(0, top + r * 0.5);
    g.bezierCurveTo(0, top, -w, top, -w, top + r * 0.5);
    g.bezierCurveTo(-w, 0, 0, r * 0.5, 0, r);
    g.bezierCurveTo(0, r * 0.5, w, 0, w, top + r * 0.5);
    g.bezierCurveTo(w, top, 0, top, 0, top + r * 0.5);
    g.closePath();
  }

  /* ================= 粒子精灵 ================= */
  var COLORS = ['#ff2d6f','#ff2d6f','#ff4d7d','#ff2d6f','#ff5c8a','#ff1f5a','#ffb703','#ff2d6f','#ffd166'];
  var SPR = [];
  function makeSprite(color){
    var S = 64, cv = document.createElement('canvas');
    cv.width = cv.height = S;
    var g = cv.getContext('2d');
    g.translate(S / 2, S / 2);
    g.shadowColor = color;
    g.shadowBlur = 7;
    g.fillStyle = color;
    heartPath(g, S * 0.33);
    g.fill();
    return cv;
  }
  COLORS.forEach(function(c){ SPR.push(makeSprite(c)); });

  /* ================= 星空 / 花瓣 ================= */
  var STARS = [], PETALS = [];
  function buildStars(){
    STARS = [];
    var n = Math.round(Math.min(230, W * H / 8000));
    for (var i = 0; i < n; i++){
      STARS.push({
        x: Math.random() * W, y: Math.random() * H,
        r: 0.5 + Math.random() * 1.7,
        ph: Math.random() * 6.283, sp: 0.5 + Math.random() * 1.6,
        hue: Math.random() < 0.5 ? '255,206,228' : '255,244,236'
      });
    }
  }
  function buildPetals(){
    PETALS = [];
    var n = Math.round(Math.min(30, Math.max(10, W / 42)));
    for (var i = 0; i < n; i++){
      PETALS.push({
        x: Math.random() * W, y: Math.random() * H,
        s: 4 + Math.random() * 8,
        vy: 0.22 + Math.random() * 0.75, vx: (Math.random() - 0.5) * 0.55,
        rot: Math.random() * 6.283, vr: (Math.random() - 0.5) * 0.024,
        sw: Math.random() * 6.283, a: 0.22 + Math.random() * 0.45
      });
    }
  }

  /* ================= 主粒子 ================= */
  var P = [];
  function resetParticles(n){
    P = [];
    var cx = W / 2, cy = H / 2;
    for (var i = 0; i < n; i++){
      var a = Math.random() * 6.283, sp = 1.5 + Math.random() * 8;
      P.push({
        x: cx + (Math.random() - 0.5) * 70,
        y: cy + (Math.random() - 0.5) * 70,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        tx: cx, ty: cy, hasT: false, die: false,
        si: (Math.random() * SPR.length) | 0,
        sz: 9 + Math.random() * 8,
        rot: Math.random() * 6.283, spin: (Math.random() - 0.5) * 0.07,
        ph: Math.random() * 6.283,
        km: 0.85 + Math.random() * 0.42,
        a: 0.72 + Math.random() * 0.28
      });
    }
  }

  /* ================= 阶段 ================= */
  var stage = 'burst';
  var textInfo = null;

  function toHeart(){
    stage = 'heart';
    var cx = W / 2, cy = H * 0.47;
    var s = (Math.min(W, H) * 0.60) / 32;
    var n = P.length;
    for (var i = 0; i < n; i++){
      var p = P[i];
      if (p.die) continue;
      var t = (i / n) * 6.28318;
      var hx = 16 * Math.pow(Math.sin(t), 3);
      var hy = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
      var j = 0.90 + Math.random() * 0.12;
      p.tx = cx + hx * s * j + (Math.random() - 0.5) * 4;
      p.ty = cy - hy * s * j + (Math.random() - 0.5) * 4;
      p.hasT = true;
      p.sz = 10 + Math.random() * 9;
    }
    shock(cx, cy, Math.min(W, H) * 0.55);
  }

  function burstHeart(){
    stage = 'broken';
    var cx = W / 2, cy = H * 0.47;
    for (var i = 0; i < P.length; i++){
      var p = P[i];
      if (p.die) continue;
      var a = Math.random() * 6.283, sp = 3 + Math.random() * 11;
      p.hasT = false;
      p.vx = Math.cos(a) * sp;
      p.vy = Math.sin(a) * sp;
    }
    shock(cx, cy, Math.min(W, H) * 0.85);
    flash();
  }

  function buildTextPoints(){
    var portrait = H > W * 1.02;
    var lines = portrait ? ['小霞', '我爱你'] : ['小霞我爱你'];
    var maxChars = 1;
    for (var i = 0; i < lines.length; i++) maxChars = Math.max(maxChars, lines[i].length);

    var fs = Math.min(W * 0.74 / maxChars, H * (portrait ? 0.155 : 0.235));
    fs = Math.max(fs, 26);
    var lh = fs * 1.18;
    var cx = W / 2, cy = H * 0.455;
    var startY = cy - (lines.length - 1) * lh / 2;

    var off = document.createElement('canvas');
    off.width = Math.max(2, Math.ceil(W));
    off.height = Math.max(2, Math.ceil(H));
    var g = off.getContext('2d');
    g.font = '800 ' + fs.toFixed(1) + 'px "PingFang SC","Hiragino Sans GB","Microsoft YaHei","Heiti SC","Noto Sans CJK SC",sans-serif';
    try { g.letterSpacing = (fs * 0.07).toFixed(1) + 'px'; } catch (e) {}
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.fillStyle = '#fff';
    for (var li = 0; li < lines.length; li++) g.fillText(lines[li], cx, startY + li * lh);

    var data = g.getImageData(0, 0, off.width, off.height).data;
    var pts = [], step = 2;
    for (var y = 0; y < off.height; y += step){
      var row = y * off.width * 4;
      for (var x = 0; x < off.width; x += step){
        if (data[row + x * 4 + 3] > 130) pts.push(x, y);
      }
    }
    var total = pts.length / 2;
    var idxs = [];
    for (var k = 0; k < total; k++) idxs.push(k);
    for (var m = total - 1; m > 0; m--){
      var r = (Math.random() * (m + 1)) | 0;
      var tmp = idxs[m]; idxs[m] = idxs[r]; idxs[r] = tmp;
    }
    var take = Math.min(total, MAXP);
    var out = [];
    for (var q = 0; q < take; q++){
      var id = idxs[q];
      out.push(pts[id * 2], pts[id * 2 + 1]);
    }
    var spacing = total > 0 ? 2 * (total / Math.max(1, take)) : 6;
    return {
      pts: out, count: take, fs: fs, spacing: spacing, cx: cx,
      bottom: startY + (lines.length - 1) * lh + fs * 0.64
    };
  }

  function toText(){
    stage = 'text';
    var info = buildTextPoints();
    textInfo = info;
    var n = info.count;
    var base = Math.max(6, Math.min(15, info.spacing * 1.75));
    for (var i = 0; i < P.length; i++){
      var p = P[i];
      if (i < n){
        p.tx = info.pts[i * 2] + (Math.random() - 0.5) * 1.4;
        p.ty = info.pts[i * 2 + 1] + (Math.random() - 0.5) * 1.4;
        p.hasT = true;
        p.sz = base * (0.9 + Math.random() * 0.3);
        p.a = 0.88 + Math.random() * 0.12;
        p.rot = (Math.random() - 0.5) * 0.9;
        p.spin = 0;
      } else {
        p.hasT = false;
        p.die = true;
        p.vy -= 1.4;
        p.vx += (Math.random() - 0.5) * 1.6;
      }
    }
    placeTextual(info);
  }

  function placeTextual(info){
    var sub = document.querySelector('.sub');
    var btn = document.querySelector('.btnwrap');
    var y = info.bottom + Math.max(30, info.fs * 0.34);
    y = Math.min(y, H - 150);
    sub.style.top = y + 'px';
    btn.style.top = Math.min(y + Math.max(70, info.fs * 0.46), H - 96) + 'px';
  }

  /* ================= 火花 / 冲击波 ================= */
  var SPK = [];
  function spawnBurst(x, y, n, power){
    for (var i = 0; i < n; i++){
      var a = Math.random() * 6.283, sp = Math.random() * power;
      SPK.push({
        x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        rot: Math.random() * 6.283, spin: (Math.random() - 0.5) * 0.22,
        sz: 7 + Math.random() * 13, si: (Math.random() * SPR.length) | 0,
        life: 1, dec: 0.005 + Math.random() * 0.011
      });
    }
  }
  var SHOCK = [];
  function shock(x, y, max){ SHOCK.push({ x: x, y: y, r: 6, max: max, a: 1 }); }

  function flash(){
    var f = document.getElementById('flash');
    f.classList.remove('go');
    void f.offsetWidth;
    f.classList.add('go');
  }

  /* ================= 尺寸 ================= */
  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    cvs.width = Math.round(W * DPR);
    cvs.height = Math.round(H * DPR);
    cvs.style.width = W + 'px';
    cvs.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    buildStars();
    buildPetals();
  }

  /* ================= 交互 ================= */
  var ptr = { x: -9999, y: -9999, on: false };
  window.addEventListener('pointermove', function(e){
    ptr.x = e.clientX; ptr.y = e.clientY; ptr.on = true;
  }, { passive: true });
  window.addEventListener('pointerdown', function(e){
    ptr.x = e.clientX; ptr.y = e.clientY; ptr.on = true;
    spawnBurst(e.clientX, e.clientY, MOBILE ? 26 : 40, 6);
  }, { passive: true });
  window.addEventListener('pointerleave', function(){ ptr.on = false; });

  /* ================= 音乐 ================= */
  var AC = null, musicTimer = null, musicOn = false;
  var MELODY = [0, 4, 7, 9, 12, 9, 7, 4, 2, 5, 9, 12, 16, 12, 9, 5];
  function startMusic(){
    try{
      if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
      if (AC.state === 'suspended') AC.resume();
    } catch (err){ return; }
    musicOn = true;
    var base = 261.63, idx = 0;
    function play(){
      if (!musicOn || !AC) return;
      var semi = MELODY[idx % MELODY.length]; idx++;
      var f = base * Math.pow(2, semi / 12);
      var t0 = AC.currentTime;
      for (var k = 0; k < 2; k++){
        var o = AC.createOscillator(), g = AC.createGain();
        o.type = k === 0 ? 'sine' : 'triangle';
        o.frequency.value = f * (k === 0 ? 1 : 2);
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.linearRampToValueAtTime(k === 0 ? 0.085 : 0.028, t0 + 0.035);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.85);
        o.connect(g); g.connect(AC.destination);
        o.start(t0); o.stop(t0 + 1.95);
      }
      musicTimer = setTimeout(play, 640);
    }
    play();
  }
  function stopMusic(){ musicOn = false; if (musicTimer) clearTimeout(musicTimer); }
  var musicBtn = document.getElementById('music');
  musicBtn.addEventListener('click', function(e){
    e.stopPropagation();
    if (musicOn){ stopMusic(); musicBtn.classList.remove('on'); }
    else { startMusic(); musicBtn.classList.add('on'); }
  });

  /* ================= 按钮 ================= */
  document.getElementById('btnYes').addEventListener('click', function(e){
    e.stopPropagation();
    document.querySelector('.btnwrap').classList.remove('on');
    setTimeout(function(){ document.getElementById('final').classList.add('on'); }, 320);
    for (var i = 0; i < 9; i++){
      (function(i){
        setTimeout(function(){
          spawnBurst(W * (0.12 + Math.random() * 0.76), H * (0.12 + Math.random() * 0.5), MOBILE ? 55 : 90, 9);
          if (i % 3 === 0) shock(W / 2, H * 0.46, Math.min(W, H) * 0.7);
        }, i * 260);
      })(i);
    }
  });

  /* ================= 更新 ================= */
  function update(dt, t){
    var mk = Math.min(dt / 16.67, 2.6);
    var damp = Math.pow(0.90, mk);
    var i, p;

    for (i = 0; i < P.length; i++){
      p = P[i];
      if (p.die){
        p.a *= Math.pow(0.93, mk);
        if (p.a < 0.02) continue;
        p.vx *= Math.pow(0.985, mk);
        p.vy = p.vy * Math.pow(0.985, mk) + 0.01 * mk;
        p.x += p.vx * mk; p.y += p.vy * mk;
        p.rot += p.spin * mk;
        continue;
      }
      if (p.hasT){
        var wob = (stage === 'text') ? Math.sin(t * 0.0016 + p.ph) * 1.1 : 0;
        var dx = (p.tx + wob) - p.x;
        var dy = (p.ty + Math.cos(t * 0.0013 + p.ph) * 0.9 * (stage === 'text' ? 1 : 0)) - p.y;
        var k = 0.045 * p.km * mk;
        p.vx = (p.vx + dx * k) * damp;
        p.vy = (p.vy + dy * k) * damp;
      } else {
        p.vx *= Math.pow(0.987, mk);
        p.vy = p.vy * Math.pow(0.987, mk) + 0.015 * mk;
      }
      if (ptr.on){
        var ddx = p.x - ptr.x, ddy = p.y - ptr.y;
        var d2 = ddx * ddx + ddy * ddy;
        if (d2 < 16900 && d2 > 1){
          var d = Math.sqrt(d2);
          var f = (1 - d / 130) * 2.6;
          p.vx += (ddx / d) * f * mk;
          p.vy += (ddy / d) * f * mk;
        }
      }
      p.x += p.vx * mk;
      p.y += p.vy * mk;
      p.rot += p.spin * mk;
    }

    for (i = SPK.length - 1; i >= 0; i--){
      var s = SPK[i];
      s.vx *= Math.pow(0.975, mk);
      s.vy = s.vy * Math.pow(0.975, mk) + 0.05 * mk;
      s.x += s.vx * mk; s.y += s.vy * mk;
      s.rot += s.spin * mk;
      s.life -= s.dec * mk;
      if (s.life <= 0) SPK.splice(i, 1);
    }

    for (i = SHOCK.length - 1; i >= 0; i--){
      var w = SHOCK[i];
      w.r += (w.max - w.r) * 0.055 * mk;
      w.a -= 0.016 * mk;
      if (w.a <= 0) SHOCK.splice(i, 1);
    }

    for (i = 0; i < PETALS.length; i++){
      var pt = PETALS[i];
      pt.y += pt.vy * mk;
      pt.x += (pt.vx + Math.sin(t * 0.0009 + pt.sw) * 0.5) * mk;
      pt.rot += pt.vr * mk;
      if (pt.y > H + 30){ pt.y = -30; pt.x = Math.random() * W; }
      if (pt.x < -40) pt.x = W + 30;
      if (pt.x > W + 40) pt.x = -30;
    }
  }

  /* ================= 绘制 ================= */
  function draw(t){
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, W, H);

    /* 星星 */
    ctx.globalCompositeOperation = 'lighter';
    for (var i = 0; i < STARS.length; i++){
      var st = STARS[i];
      var tw = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(t * 0.0022 * st.sp + st.ph));
      ctx.globalAlpha = tw * 0.85;
      ctx.fillStyle = 'rgba(' + st.hue + ',1)';
      ctx.beginPath();
      ctx.arc(st.x, st.y, st.r, 0, 6.283);
      ctx.fill();
    }

    /* 花瓣 */
    ctx.globalCompositeOperation = 'source-over';
    for (var j = 0; j < PETALS.length; j++){
      var pe = PETALS[j];
      var ca = Math.cos(pe.rot), sa = Math.sin(pe.rot), sz = pe.s;
      ctx.setTransform(DPR * ca, DPR * sa, -DPR * sa, DPR * ca, DPR * pe.x, DPR * pe.y);
      ctx.globalAlpha = pe.a;
      var grd = ctx.createLinearGradient(0, -sz * 1.25, 0, sz * 1.3);
      grd.addColorStop(0, 'rgba(255,235,242,0.95)');
      grd.addColorStop(0.45, 'rgba(255,140,180,0.95)');
      grd.addColorStop(1, 'rgba(226,40,100,0.92)');
      ctx.fillStyle = grd;
      ctx.beginPath();
      ctx.moveTo(0, -sz * 1.28);
      ctx.bezierCurveTo(sz * 1.35, -sz * 0.55, sz * 1.1, sz * 0.95, 0, sz * 1.3);
      ctx.bezierCurveTo(-sz * 1.1, sz * 0.95, -sz * 1.35, -sz * 0.55, 0, -sz * 1.28);
      ctx.closePath();
      ctx.fill();
      ctx.globalAlpha = pe.a * 0.55;
      ctx.strokeStyle = 'rgba(255,255,255,0.9)';
      ctx.lineWidth = Math.max(0.6, sz * 0.09);
      ctx.beginPath();
      ctx.moveTo(0, -sz * 1.1);
      ctx.quadraticCurveTo(sz * 0.25, 0, 0, sz * 1.05);
      ctx.stroke();
    }
    ctx.globalCompositeOperation = 'lighter';

    /* 冲击波 */
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    for (var k = 0; k < SHOCK.length; k++){
      var sh = SHOCK[k];
      ctx.globalAlpha = Math.max(0, sh.a) * 0.5;
      ctx.strokeStyle = 'rgba(255,130,180,1)';
      ctx.lineWidth = 1 + sh.a * 4;
      ctx.beginPath();
      ctx.arc(sh.x, sh.y, sh.r, 0, 6.283);
      ctx.stroke();
    }

    /* 主粒子：文字阶段用正常混合保证字形清晰，其余阶段用叠加发光 */
    ctx.globalCompositeOperation = (stage === 'text') ? 'source-over' : 'lighter';
    for (var n = 0; n < P.length; n++){
      var p = P[n];
      if (p.die && p.a < 0.02) continue;
      var tw2 = (stage === 'text') ? 1 : (0.86 + 0.14 * Math.sin(t * 0.0032 + p.ph));
      var s2 = p.sz * (stage === 'text' ? (0.92 + 0.12 * tw2) : 1);
      var c2 = Math.cos(p.rot), s3 = Math.sin(p.rot);
      ctx.setTransform(DPR * c2 * s2 / 64, DPR * s3 * s2 / 64, -DPR * s3 * s2 / 64, DPR * c2 * s2 / 64, DPR * p.x, DPR * p.y);
      ctx.globalAlpha = Math.min(1, p.a * tw2);
      ctx.drawImage(SPR[p.si], -32, -32, 64, 64);
    }

    /* 火花 */
    ctx.globalCompositeOperation = 'lighter';
    for (var q = 0; q < SPK.length; q++){
      var s4 = SPK[q];
      var c3 = Math.cos(s4.rot), sn = Math.sin(s4.rot), sz2 = s4.sz * (0.6 + s4.life * 0.6);
      ctx.setTransform(DPR * c3 * sz2 / 64, DPR * sn * sz2 / 64, -DPR * sn * sz2 / 64, DPR * c3 * sz2 / 64, DPR * s4.x, DPR * s4.y);
      ctx.globalAlpha = Math.max(0, Math.min(1, s4.life));
      ctx.drawImage(SPR[s4.si], -32, -32, 64, 64);
    }

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  /* ================= 时间线 ================= */
  var TL = [
    { t: 750,  fn: function(){ document.querySelector('.top').classList.add('on'); } },
    { t: 820,  fn: toHeart },
    { t: 3500, fn: burstHeart },
    { t: 4400, fn: toText },
    { t: 6300, fn: function(){ document.querySelector('.sub').classList.add('on'); } },
    { t: 7500, fn: function(){ document.querySelector('.btnwrap').classList.add('on'); } }
  ];
  var start = performance.now();
  var last = start;
  var fired = [];

  function loop(now){
    var t = now - start;
    var dt = Math.min(now - last, 70);
    last = now;
    for (var i = 0; i < TL.length; i++){
      if (!fired[i] && t >= TL[i].t){ fired[i] = true; try{ TL[i].fn(); }catch(e){} }
    }
    if (stage === 'text' && textInfo && textInfo.count > 0 && Math.random() < 0.04){
      var sx = (Math.random() * textInfo.count) | 0;
      spawnBurst(textInfo.pts[sx * 2], textInfo.pts[sx * 2 + 1], MOBILE ? 2 : 4, 3.6);
    }
    update(dt, t);
    draw(t);
    requestAnimationFrame(loop);
  }

  /* ================= 启动 ================= */
  resize();
  resetParticles(MAXP);
  requestAnimationFrame(loop);

  /* 首屏从中心炸开 */
  setTimeout(function(){ spawnBurst(W / 2, H / 2, MOBILE ? 50 : 80, 8); }, 60);

  var rt = null;
  window.addEventListener('resize', function(){
    if (rt) clearTimeout(rt);
    rt = setTimeout(function(){
      resize();
      if (stage === 'heart') toHeart();
      else if (stage === 'text') toText();
    }, 220);
  });
})();
</script>
</body>
